<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سيادة — لعبة سياسية</title>
<style>
:root{--bg:#e9eef2;--sea:#cfe3ef;--edge:#8e9a94;--ink:#1d2b36;--mut:#5d6b76;--panel:#fff;--line:#d3dae0;--acc:#0a7ea4;--good:#2f855a;--bad:#c0392b;--warn:#c76a05;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;--sea:#0f1c26;--edge:#4a5a64;--ink:#e6edf1;--mut:#97a6b0;--panel:#18232b;--line:#2a3a44;--acc:#4cc3ea;--good:#5fd08f;--bad:#ff7b6b;--warn:#f5b04a}}
:root[data-theme="dark"]{--bg:#0e1419;--sea:#0f1c26;--edge:#4a5a64;--ink:#e6edf1;--mut:#97a6b0;--panel:#18232b;--line:#2a3a44;--acc:#4cc3ea;--good:#5fd08f;--bad:#ff7b6b;--warn:#f5b04a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;font-size:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px}
h1{font-size:17px;margin:0}
#date{font-weight:700;font-size:15px}
.ctl{display:flex;gap:4px;align-items:center}
button{font:inherit;color:var(--ink);cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 10px}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#app{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:0 8px 8px}
#mapwrap{position:relative;flex:1 1 38%;min-height:200px;border-radius:12px;overflow:hidden;background:var(--sea)}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
#cv{transform-origin:0 0;will-change:transform}
#modes{position:absolute;right:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap}
#modes .btn{padding:4px 8px;font-size:12px}
#zoom{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zb{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:20px}
#card{position:absolute;left:8px;right:8px;bottom:8px;max-width:360px;margin-inline:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:none;font-size:13px}
#card h3{margin:0 0 4px;font-size:15px}
#card .row{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mut)}
#card .row b{color:var(--ink)}
#panel{flex:1 1 62%;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
#tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#tabs button{flex:1 0 auto;border:0;background:none;font-size:12.5px;padding:10px 11px;border-bottom:3px solid transparent;color:var(--mut)}
#tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc);font-weight:700}
#body{flex:1;overflow:auto;padding:10px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.k span{display:block;color:var(--mut);font-size:12px}
.k b{font-size:16px}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%}
h4{margin:12px 0 6px;font-size:13px;color:var(--mut)}
.sl{margin:10px 0}
.sl label{display:flex;justify-content:space-between;gap:8px}
.sl input{width:100%}
.sl small{color:var(--mut)}
.news div{padding:6px 0;border-bottom:1px solid var(--line)}
.news .g{color:var(--good)}.news .b{color:var(--bad)}.news .w{color:var(--warn)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--mut);font-weight:400;font-size:12px}
tr.me{font-weight:700;color:var(--acc)}
#foot{display:none;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
#foot>.btn{flex:1;padding:11px 10px}
#foot .sm{padding:8px 8px;font-size:13px}
select{flex:1;min-width:0;padding:7px 4px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px}
#body.pick{display:flex;flex-direction:column;overflow:hidden}
#body.pick .list{flex:1;min-height:0;max-height:none}
#foot .btn[disabled]{opacity:.5}
#err{display:none;position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;padding:6px 10px;z-index:9;font-size:12px;direction:ltr}
.list{max-height:30vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.list button{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 10px;text-align:right}
.list button[aria-pressed="true"]{background:var(--acc);color:#fff}
input[type=search]{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;margin:6px 0}
.par{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0}
.par i{display:block;height:100%}
.pl{display:flex;justify-content:space-between;gap:6px;padding:3px 0;font-size:13px}
.pl b{font-weight:600}
.law{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}
.law h5{margin:0 0 3px;font-size:14px}
.law p{margin:2px 0 6px;color:var(--mut);font-size:12px}
.law .r{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
.law .btn{padding:6px 12px}
.law .btn[disabled]{opacity:.45}
#overbox button{display:block;width:100%;margin:8px 0;text-align:right}
#overbox h3{margin:0 0 8px}#overbox p{text-align:right;color:var(--mut);margin:0 0 6px}
#over{position:fixed;left:0;right:0;top:0;bottom:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#over div{background:var(--panel);border-radius:14px;padding:20px;max-width:340px;text-align:center}
@media(min-width:900px){#app{flex-direction:row}#mapwrap{flex:1 1 auto}#panel{flex:0 0 400px}}
</style></head><body>
